# Builds and deploys both deliverables to GitHub Pages on every push to main:
#   /     — the phase-1 static prototype (copied as-is, no build step)
#   /ui/  — the phase-2 component gallery (Vite build of way2-ui)
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: way2-ui/package-lock.json

      - name: Build component gallery
        run: |
          npm ci --prefix way2-ui
          npm run build --prefix way2-ui

      - name: Assemble site
        run: |
          mkdir -p _site/ui
          cp index.html _site/
          cp -r assets _site/
          cp README.md way2-prototype-brief.md _site/ 2>/dev/null || true
          cp -r way2-ui/dist/. _site/ui/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
